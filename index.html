<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Chofer - Gestión de Flota</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0f172a; 
            margin: 0; 
            padding: 20px; 
            padding-bottom: 90px; 
            color: #f8fafc;
        }
        .container { 
            max-width: 500px; 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            margin: auto; 
            border: 1px solid #334155;
        }
        
        /* Encabezado con Logo Animado */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-bottom: 2px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .logo-container {
            width: 45px;
            height: 45px;
            background: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.6);
            animation: pulseLogo 2s infinite ease-in-out;
        }
        @keyframes pulseLogo {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(37, 99, 235, 0.4); }
            50% { transform: scale(1.08); box-shadow: 0 0 20px rgba(59, 130, 246, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(37, 99, 235, 0.4); }
        }

        h2 { 
            color: #f8fafc; 
            margin: 0;
            font-size: 1.4rem;
        }
        h3 {
            color: #93c5fd;
            font-size: 1.1rem;
            margin-top: 25px;
            border-bottom: 1px solid #334155;
            padding-bottom: 6px;
        }
        label { 
            font-weight: bold; 
            display: block; 
            margin-top: 15px; 
            color: #cbd5e1;
            font-size: 0.95rem;
        }
        input, select, textarea { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            background: #0f172a;
            border: 1px solid #475569; 
            border-radius: 6px; 
            box-sizing: border-box; 
            color: #f8fafc;
            font-size: 0.95rem;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }
        .checklist-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 10px; 
            padding: 10px; 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 6px; 
            font-size: 0.9rem;
        }
        button { 
            background: #2563eb; 
            color: white; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 6px; 
            cursor: pointer; 
            margin-top: 20px; 
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }
        
        .btn-danger {
            background: #dc2626;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }

        #gps-status { 
            margin-top: 15px; 
            padding: 12px; 
            background: #064e3b; 
            border: 1px solid #059669;
            border-radius: 6px; 
            font-size: 14px; 
            text-align: center; 
            color: #a7f3d0;
        }
        
        /* Sistema de Pestañas */
        .vista-seccion { display: none; }
        .vista-seccion.active { display: block; }

        /* Isla Flotante Inferior */
        .nav-island {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            display: flex;
            gap: 10px;
            z-index: 1000;
            border: 1px solid #334155;
        }
        .nav-btn {
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: auto;
            transition: all 0.2s ease;
        }
        .nav-btn.active {
            background: #2563eb;
            color: white;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Encabezado con Logo Animado -->
    <div class="app-header">
        <div class="logo-container">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 3h15v13H1z"></path>
                <path d="M16 8h4l3 3v5h-7V8z"></path>
                <circle cx="5.5" cy="18.5" r="2.5"></circle>
                <circle cx="18.5" cy="18.5" r="2.5"></circle>
            </svg>
        </div>
        <h2>Panel del Chofer</h2>
    </div>

    <!-- SECCIÓN 1: CHECK-LIST -->
    <div id="seccion-checklist" class="vista-seccion active">
        <form id="checklistForm">
            <label for="chofer">Nombre del Chofer:</label>
            <input type="text" id="chofer" required placeholder="Ej: Gustavo Mercado">

            <label for="dominio">Dominio / Patente:</label>
            <input type="text" id="dominio" required placeholder="Ej: AF 189 LD">

            <label for="tipo_vehiculo">Tipo de Vehículo:</label>
            <select id="tipo_vehiculo">
                <option value="Vehiculo (Auto o Camioneta)">Vehículo (Auto o Camioneta)</option>
                <option value="Camión">Camión</option>
            </select>

            <h3>📋 Check-list Diario de Seguridad</h3>
            <div id="checklist-container"></div>

            <label for="observaciones">Observaciones generales:</label>
            <textarea id="observaciones" rows="3" placeholder="Detalles o novedades..."></textarea>

            <button type="submit" id="btnEnviar">Enviar Check-list y Activar GPS</button>
        </form>

        <div id="gps-status" style="display:none;">
            📍 <b>GPS Activo (Pantalla Protegida):</b> Transmitiendo en vivo... <span id="coords">Esperando señal...</span>
            <button type="button" class="btn-danger" onclick="finalizarTurno()">🛑 Finalizar Turno / Detener GPS</button>
        </div>
    </div>

    <!-- SECCIÓN 2: CARGA DE COMBUSTIBLE -->
    <div id="seccion-combustible" class="vista-seccion">
        <form id="combustibleForm">
            <h3>⛽ Carga y Gasto de Combustible</h3>
            <p style="font-size: 0.85rem; color: #94a3b8; text-align: center;">Registrá tu carga para calcular automáticamente el rendimiento en Km/L.</p>

            <label for="chofer_combustible">Nombre del Chofer:</label>
            <input type="text" id="chofer_combustible" required placeholder="Ej: Gustavo Mercado">

            <label for="dominio_combustible">Dominio / Patente:</label>
            <input type="text" id="dominio_combustible" required placeholder="Ej: AF 189 LD">

            <label for="litros">Litros Cargados:</label>
            <input type="number" step="0.01" id="litros" required placeholder="Ej: 45.5">

            <label for="costoTotal">Costo Total ($):</label>
            <input type="number" step="0.01" id="costoTotal" required placeholder="Ej: 35000">

            <label for="odometroActual">Kilometraje Actual del Tablero:</label>
            <input type="number" id="odometroActual" required placeholder="Ej: 12450">

            <button type="submit">Registrar Carga de Combustible</button>
        </form>
    </div>
</div>

<!-- ISLA INTERACTIVA INFERIOR (SOLAPAS) -->
<div class="nav-island">
    <button type="button" class="nav-btn active" onclick="cambiarVista('checklist', this)">📋 Check-list</button>
    <button type="button" class="nav-btn" onclick="cambiarVista('combustible', this)">⛽ Combustible</button>
</div>

<script>
    function cambiarVista(vista, btn) {
        document.querySelectorAll('.vista-seccion').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

        if (vista === 'checklist') {
            document.getElementById('seccion-checklist').classList.add('active');
        } else if (vista === 'combustible') {
            document.getElementById('seccion-combustible').classList.add('active');
        }
        btn.classList.add('active');
    }

    const itemsChecklist = [
        "Documentación Completa (Licencia, Cédula, Seguro, ITV, etc.)",
        "Cinturón de seguridad",
        "Parabrisas y espejos retrovisores",
        "Botiquín de emergencias",
        "Neumáticos",
        "Luces",
        "Fluidos (aceite y agua)",
        "Bocina",
        "Limpieza"
    ];

    const container = document.getElementById('checklist-container');
    itemsChecklist.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'checklist-item';
        div.innerHTML = `
            <span>${item}</span>
            <select name="item_${index}" style="width: 100px; margin: 0; background: #0f172a; color: white;">
                <option value="OK">OK</option>
                <option value="Falla">Falla</option>
                <option value="N/A">N/A</option>
            </select>
        `;
        container.appendChild(div);
    });

    let intervaloGPS = null;
    let wakeLock = null;

    // Activar Wake Lock para que la pantalla no se apague nunca
    async function solicitarWakeLock() {
        if ('wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log("💡 Wake Lock activado: La pantalla no se suspenderá.");
            } catch (err) {
                console.warn(`${err.name}, ${err.message}`);
            }
        }
    }

    // Enviar el Check-list al Servidor Backend
    document.getElementById('checklistForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const chofer = document.getElementById('chofer').value;
        const dominio = document.getElementById('dominio').value;
        const tipo_vehiculo = document.getElementById('tipo_vehiculo').value;
        const observaciones = document.getElementById('observaciones').value;

        const respuestas = {};
        itemsChecklist.forEach((item, index) => {
            respuestas[item] = document.querySelector(`[name="item_${index}"]`).value;
        });

        try {
            const respuesta = await fetch('/api/checklist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chofer, dominio, tipo_vehiculo, respuestas, observaciones })
            });

            const resultado = await respuesta.json();
            if (respuesta.ok) {
                alert("¡Check-list enviado con éxito! GPS y modo de pantalla activa iniciados.");
                document.getElementById('gps-status').style.display = 'block';
                solicitarWakeLock();
                iniciarEnvioGPS(chofer, dominio);
            } else {
                alert("Error: " + resultado.error);
            }
        } catch (error) {
            alert("No se pudo conectar con el servidor.");
        }
    });

    // Registrar Carga de Combustible
    document.getElementById('combustibleForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const datosCarga = {
            chofer: document.getElementById('chofer_combustible').value,
            dominio: document.getElementById('dominio_combustible').value,
            litros: document.getElementById('litros').value,
            costoTotal: document.getElementById('costoTotal').value,
            odometroActual: document.getElementById('odometroActual').value
        };

        try {
            const respuesta = await fetch('/api/combustible', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datosCarga)
            });
            const resultado = await respuesta.json();
            if (respuesta.ok) {
                alert("⛽ ¡Carga registrada con éxito!");
                document.getElementById('combustibleForm').reset();
            } else {
                alert("Error: " + resultado.error);
            }
        } catch (error) {
            alert("No se pudo conectar con el servidor.");
        }
    });

    function iniciarEnvioGPS(chofer, vehiculo) {
        if (!navigator.geolocation) return;
        if (intervaloGPS) clearInterval(intervaloGPS);

        enviarCoordenadas(chofer, vehiculo);
        intervaloGPS = setInterval(() => enviarCoordenadas(chofer, vehiculo), 30000);
    }

    function enviarCoordenadas(chofer_id, vehiculo) {
        navigator.geolocation.getCurrentPosition(async (position) => {
            const latitud = position.coords.latitude;
            const longitud = position.coords.longitude;
            document.getElementById('coords').innerText = `Lat: ${latitud.toFixed(4)}, Lon: ${longitud.toFixed(4)}`;

            try {
                await fetch('/api/ubicacion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chofer_id, vehiculo, latitud, longitud })
                });
            } catch (err) {}
        });
    }

    // Botón para Finalizar Turno y cortar el GPS manualmente
    function finalizarTurno() {
        if (intervaloGPS) {
            clearInterval(intervaloGPS);
            intervaloGPS = null;
        }
        if (wakeLock !== null) {
            wakeLock.release().then(() => { wakeLock = null; });
        }
        document.getElementById('gps-status').style.display = 'none';
        alert("🛑 Turno finalizado. El seguimiento GPS ha sido detenido.");
    }
</script>

</body>
</html>
